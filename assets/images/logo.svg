<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="760"
     height="180"
     viewBox="0 0 760 180"
     role="img"
     aria-label="ProjectCostCalculators.com logo">
  <title>ProjectCostCalculators.com</title>
  <desc>Estimate what services should cost.</desc>

  <defs>
    <style>
      :root{
        --accent:#1a73e8;
        --text:#111827;
        --muted:#6b7280;
      }
      .wordmark{
        font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-weight:800;
        font-size:50px; /* reduced */
        fill:var(--text);
        letter-spacing:-0.9px;
      }
      .dotcom{
        font-weight:700;
        fill:var(--muted);
      }
      .tagline{
        font-family:"Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-weight:700; /* increased */
        font-size:30px;  /* increased */
        fill:var(--muted);
        letter-spacing:0.15px;
      }
      .icon-stroke{
        stroke:var(--accent);
        stroke-width:10;
        stroke-linecap:round;
        stroke-linejoin:round;
        fill:none;
      }
      .icon-fill{
        fill:var(--accent);
      }
    </style>
  </defs>

  <!-- Icon -->
  <g transform="translate(18 30)">
    <rect x="0" y="0" width="92" height="92" rx="18" ry="18"
          class="icon-stroke"/>
    <rect x="20" y="56" width="14" height="20" rx="6" class="icon-fill"/>
    <rect x="42" y="42" width="14" height="34" rx="6" class="icon-fill" opacity="0.85"/>
    <rect x="64" y="28" width="14" height="48" rx="6" class="icon-fill" opacity="0.7"/>
    <path d="M20 30 L34 44 L70 16" class="icon-stroke"/>
  </g>

  <!-- Wordmark + tagline -->
  <g transform="translate(130 72)">
    <text class="wordmark">
      ProjectCostCalculators<tspan class="dotcom">.com</tspan>
    </text>
    <text class="tagline" x="2" y="42">
      Estimate what services should cost.
    </text>
  </g>
</svg>
