<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="630"
     viewBox="0 0 1200 630"
     role="img"
     aria-label="ProjectCostCalculators.com Open Graph image">

  <title>ProjectCostCalculators.com</title>
  <desc>Estimate what services should cost.</desc>

  <defs>
    <style>
      :root {
        --accent:#1a73e8;
        --text:#111827;
        --muted:#6b7280;
        --bg:#f9fafb;
      }

      .bg {
        fill: var(--bg);
      }

      .wordmark {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 800;
        font-size: 68px;
        fill: var(--text);
        letter-spacing: -1.2px;
      }

      .dotcom {
        font-weight: 700;
        fill: var(--muted);
      }

      .tagline {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        font-weight: 700;
        font-size: 40px;
        fill: var(--muted);
        letter-spacing: 0.2px;
      }

      .icon-stroke {
        stroke: var(--accent);
        stroke-width: 16;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }

      .icon-fill {
        fill: var(--accent);
      }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" x="0" y="0" width="1200" height="630" />

  <!-- Icon -->
  <g transform="translate(80 210)">
    <rect x="0" y="0" width="140" height="140" rx="28" ry="28"
          class="icon-stroke"/>
    <rect x="30" y="88" width="22" height="34" rx="10" class="icon-fill"/>
    <rect x="62" y="66" width="22" height="56" rx="10" class="icon-fill" opacity="0.85"/>
    <rect x="94" y="44" width="22" height="78" rx="10" class="icon-fill" opacity="0.7"/>
    <path d="M30 48 L54 72 L110 26" class="icon-stroke"/>
  </g>

  <!-- Text -->
  <g transform="translate(250 270)">
    <text class="wordmark">
      ProjectCostCalculators<tspan class="dotcom">.com</tspan>
    </text>
    <text class="tagline" x="4" y="72">
      Estimate what services should cost.
    </text>
  </g>

</svg>
